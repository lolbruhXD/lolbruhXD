name: Refresh profile activity

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch GitHub data and render local artwork
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/update_activity.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile activity artwork"
            git push
          fi
